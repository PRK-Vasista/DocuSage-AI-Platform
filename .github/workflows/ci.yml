name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app
      - name: Run pytest
        env:
          ENABLE_ALEMBIC_MIGRATIONS: "false"
          ENABLE_CREATE_ALL_FALLBACK: "true"
        run: PYTHONPATH=. pytest -q --tb=short

  ai-service:
    name: AI service pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app
      - name: Run pytest
        run: pytest -q --tb=short

  evals:
    name: Eval harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pytest
        run: pip install pytest
      - name: Run eval metric tests
        working-directory: evals
        run: PYTHONPATH=. pytest test_metrics.py -q --tb=short

  frontend-syntax:
    name: Frontend JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse plain ESM JS modules
        run: |
          set -e
          for f in \
            frontend/src/api/apiService.js \
            frontend/src/config/appConfig.js \
            frontend/src/utils/downloadText.js \
            frontend/src/utils/formatters.js \
            frontend/src/utils/processingStatus.js \
            frontend/src/hooks/useAuth.js \
            frontend/src/hooks/useTheme.js
          do
            echo "Checking $f"
            node --input-type=module --check < "$f"
          done
