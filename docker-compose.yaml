services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: docu-sage-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d docu_sage_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docu_sage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  # 2. Ollama runtime (local LLM — no API key)
  ollama:
    image: ollama/ollama:latest
    container_name: docu-sage-ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    # Optional host access for debugging: http://localhost:11434
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # 3. Isolated AI unit (summarize + chat). Talks only to Ollama.
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: docu-sage-ai
    restart: always
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      OLLAMA_TIMEOUT_SECONDS: "180"
      OLLAMA_PULL_ON_STARTUP: "true"
      MAX_CONTEXT_CHARS: "12000"
      MAX_SUMMARY_CHARS: "4000"
    ports:
      - "8100:8100"
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ./ai-service:/app

  # 4. Python Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docu-sage-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/docu_sage_db
      SECRET_KEY: "please-change-this-to-a-long-random-string-in-next-sprint"
      ALGORITHM: "HS256"
      ENABLE_ALEMBIC_MIGRATIONS: "true"
      ENABLE_CREATE_ALL_FALLBACK: "true"
      DB_MIGRATION_MAX_RETRIES: "5"
      DB_MIGRATION_RETRY_SECONDS: "2"
      # AI unit (never talk to Ollama directly from backend)
      AI_SERVICE_URL: http://ai-service:8100
      AI_SERVICE_TIMEOUT_SECONDS: "180"
      AI_SERVICE_ENABLED: "true"
      AI_FALLBACK_TO_EXTRACTIVE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./backend:/app
      - user_files:/app/user_uploads/

  # 5. Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    container_name: docu-sage-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  user_files:
  ollama_data:
